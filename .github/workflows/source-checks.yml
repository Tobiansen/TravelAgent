name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Gateway tests without an Exa key
        working-directory: app/Backend
        run: python -m unittest discover -s tests -v

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Windows launcher fixtures
        shell: powershell
        run: |
          & .\app\tools\Test-DemoLauncher.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\app\tools\Test-DemoSupervisor.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

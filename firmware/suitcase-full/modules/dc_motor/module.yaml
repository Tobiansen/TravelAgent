id: dc_motor
name: DC Motor
display_name: DC Motor
category: motor
interface: gpio
size: 1
description: Project-local bounded bench use of the Atech IN1/IN2 motor driver.
driver:
  header: dc_motor.h
  source: dc_motor.cpp
  class_name: DCMotor
templates:
  globals: |
    DCMotor {{ instance }}({{ pin_b }}, {{ pin_a }});
  setup: |
    {{ instance }}.begin();
  loop: ""
# Deliberately omit the SDK's unbounded raw speed actions in this bench project.
# Button A starts a firmware-bounded pulse; button B cancels it.
actions: []
events: []
lib_deps: []
usage: |
  {{ instance }}.setSpeed(128);
  {{ instance }}.stop();
  bool ready = {{ instance }}.isReady(); // PWM setup only.
